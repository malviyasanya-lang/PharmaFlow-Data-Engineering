
version: 2

sources:
  - name: bronze
    database: PHARMAFLOW
    schema: BRONZE
    tables:
      - name: RAW_INVENTORY_TRANSACTIONS

      - name: raw_products
        identifier: RAW_PRODUCTS

      - name: raw_suppliers
        identifier: RAW_SUPPLIERS

      - name: raw_warehouses
        identifier: RAW_WAREHOUSES

      - name: raw_sales_orders
        identifier: RAW_SALES_ORDERS

models:
  - name: stg_inventory_transactions
    columns:
      - name: TRANSACTION_ID
        data_tests:
          - unique
          - not_null

      - name: TRANSACTION_TYPE
        data_tests:
          - accepted_values:
              arguments:
                values: ['INBOUND', 'OUTBOUND']
